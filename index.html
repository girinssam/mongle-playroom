<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F1"><meta name="description" content="4~6세 어린이를 위한 열두 가지 터치 놀이. 기억력, 숫자, 글자를 즐겁게 배워요.">
<title>몽글몽글 놀이방</title>
<link rel="icon" type="image/png" href="images/brand/favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="몽글몽글"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#FBF7F1;--card:#fff;--ink:#4B3F3A;--muted:#857870;--line:#EADFD2;
 --butter:#FBEBBB;--butter-d:#E8CF86;
 --sage:#DCEBD3;--sage-d:#A6C8A0;--sage-deep:#5F9172;--sage-deeper:#477058;
 --sky:#D7E9F3;--sky-d:#9FC7DD;
 --blush:#F8DDD7;--blush-d:#E6B0A7;
 --lilac:#E6DFF2;--lilac-d:#B8A8DA;
 --hue:var(--sage);--hue-d:var(--sage-d);
 --ui:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
 --play:'Jua','Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
}
[data-hue=butter]{--hue:var(--butter);--hue-d:var(--butter-d)}
[data-hue=sage]{--hue:var(--sage);--hue-d:var(--sage-d)}
[data-hue=sky]{--hue:var(--sky);--hue-d:var(--sky-d)}
[data-hue=blush]{--hue:var(--blush);--hue-d:var(--blush-d)}
[data-hue=lilac]{--hue:var(--lilac);--hue-d:var(--lilac-d)}
*{box-sizing:border-box}
/* 아이가 실수로 화면을 당기거나·확대하거나·길게 눌러 메뉴를 띄우지 않게 */
html{-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{overscroll-behavior:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body{margin:0;word-break:keep-all;background:var(--paper);color:var(--ink);font-family:var(--ui);font-weight:400;line-height:1.5}
h1,h2,h3,p{margin:0;font-weight:400}
strong,b{font-weight:400}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,box-shadow .12s ease,background-color .2s,border-color .2s}
button:focus-visible{outline:3px solid #7FA6C9;outline-offset:3px}
button:disabled{cursor:default}
.drawn-art{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
/* 아이가 놀 때 필요 없는 글자 숨기기 (안내 문장은 화면 읽기 프로그램용으로만 남김) */
.section-top span,.game-card p,.game-head p,.setup-screen>h2,.setup-subtitle,.choice-block small,.journey-note,.find-title,.basket-empty,#tries,#reward-description,.reward-sticker,.reward-rule{display:none!important}
.hint{position:absolute!important;width:1px;height:1px;min-height:0!important;margin:0!important;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* 틀 */
.app{max-width:1080px;margin:auto;padding:20px 28px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--play);font-size:23px;border-radius:999px;padding:2px 10px 2px 2px}
.brand-icon{width:48px;height:48px;border-radius:50%;background:var(--butter);overflow:hidden;flex-shrink:0}
.brand-icon .drawn-art{width:44px;height:44px;margin:5px auto 0}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:14px}

/* 버튼 두 종류 */
.soft-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:10px 20px;border-radius:999px;background:#fff;border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:17px;white-space:nowrap}
.soft-btn svg,.primary svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.soft-btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
#sound[aria-pressed=false]{background:#F3EEE7;color:var(--muted)}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:14px 36px;border-radius:999px;background:var(--sage-deep);color:#fff;font-family:var(--play);font-size:23px;box-shadow:0 4px 0 var(--sage-deeper)}
.primary:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 var(--sage-deeper)}
.primary:disabled{opacity:.45}

/* 홈 */
.hero{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;background:var(--sage);border-radius:36px;padding:32px 36px 32px 52px;overflow:hidden;isolation:isolate}
.hero-text{padding-bottom:0}
.hero h1{font-family:var(--play);font-size:clamp(30px,4.4vw,52px);line-height:1.18;white-space:nowrap}
.hero p{margin-top:14px;font-size:18px;color:#5A6A5A}
.hero-art{display:block;width:clamp(300px,40vw,480px);aspect-ratio:3/2}
.hero-art img{display:block;width:100%;height:100%;object-fit:contain}
.section-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 4px 16px}
.section-top h2{font-family:var(--play);font-size:26px}
.section-top span{font-size:15px;color:var(--muted)}
.games{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.game-card{grid-column:span 2;display:flex;flex-direction:column;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:28px;padding:12px 12px 22px;box-shadow:0 4px 0 var(--line)}
.game-card:nth-child(n+4){grid-column:span 3}
.game-card:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.card-art{position:relative;isolation:isolate;height:150px;border-radius:20px;background:var(--hue);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;overflow:hidden}
.game-card h3{font-family:var(--play);font-size:24px;padding:0 8px}
.game-card p{color:var(--muted);font-size:15px;margin-top:3px;padding:0 8px}
.mini-card{width:84px;height:100px;background:#fff;border-radius:14px;box-shadow:0 3px 0 var(--hue-d);padding:12px 8px;transform:rotate(-8deg)}
.mini-card+.mini-card{transform:rotate(8deg)}
.card-mole{width:130px;height:130px;margin-bottom:-40px;position:relative}
.card-mole:after{content:'';position:absolute;left:-14px;right:-14px;bottom:28px;height:30px;border-radius:50%;background:#B8977C;border:5px solid #E8D6C0;z-index:-1}
.card-balloon{position:relative;display:grid;place-items:center;width:70px;height:86px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;font-family:var(--play);font-size:32px;margin-top:-18px}
.card-balloon:after{content:'';position:absolute;top:100%;left:50%;width:1.5px;height:34px;background:#9DB2BB}
.card-balloon.b1{background:#F6C9C9;transform:rotate(-8deg)}
.card-balloon.b2{background:#FBEBBB;transform:rotate(7deg) translateY(10px)}
.card-pic{width:96px;height:96px}
.card-pic.small{width:62px;height:62px}
.card-stones{display:flex;gap:8px}
.card-stones i{display:grid;place-items:center;width:46px;height:38px;border-radius:46%;background:#fff;box-shadow:0 3px 0 var(--hue-d);font-style:normal;font-family:var(--play);font-size:21px}
.home-foot{text-align:center;color:var(--muted);font-size:15px;margin-top:32px}

/* 놀이 화면 공통 */
.game-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.game-head h2{font-family:var(--play);font-size:34px;line-height:1.25}
.game-head p{color:var(--muted);margin-top:4px;font-size:16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.controls .control-group,.controls [data-level],#change-mode{display:none}
.stage{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:32px;padding:26px;min-height:420px;overflow:hidden}
.status{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.stat{background:var(--hue);border-radius:999px;padding:9px 20px;font-size:18px}
.hint{text-align:center;min-height:30px;font-size:19px;margin-top:18px;color:#6B5E55}
.start-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:380px;text-align:center}
.start-panel h2{font-family:var(--play);font-size:30px}
.start-panel p{color:var(--muted);font-size:18px;line-height:1.7;margin-bottom:8px}
.start-pic{width:150px;height:150px}

/* 고르기 화면 */
.setup-screen{max-width:820px;margin:auto;text-align:center;padding:6px 0 4px}
.setup-screen h2{font-family:var(--play);font-size:30px}
.setup-subtitle{color:var(--muted);margin:6px 0 4px;font-size:17px}
.setup-screen h3{text-align:left;font-size:19px;margin:28px 4px 12px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.choice-grid.levels{grid-template-columns:repeat(3,1fr)}
.choice-block{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;padding:16px 10px;background:#fff;border:2px solid var(--line);border-radius:24px;box-shadow:0 4px 0 var(--line)}
.choice-block[aria-pressed=true]{background:var(--hue);border-color:var(--hue-d);box-shadow:0 4px 0 var(--hue-d)}
.choice-block:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.choice-picture{height:76px;display:flex;align-items:center;justify-content:center;font-family:var(--play);font-size:30px;word-spacing:6px;white-space:nowrap}
.choice-picture .drawn-art{width:74px;height:74px}
.choice-block strong{font-size:20px}
.choice-block small{font-size:14px;color:var(--muted)}
.choice-check{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--sage-deep);color:#fff;font-size:14px;line-height:26px;display:none}
.choice-block[aria-pressed=true] .choice-check{display:block}
.level-dots{height:36px;display:flex;align-items:center;font-size:24px;letter-spacing:3px;color:#E5BE5C}
.setup-start{margin-top:32px;min-width:220px}

/* 같은 그림 찾기 */
.memory-grid{display:grid;gap:12px;max-width:720px;margin:auto;grid-template-columns:repeat(var(--cols,2),1fr)}
.memory-card{aspect-ratio:1;max-height:170px;border-radius:20px;background:var(--butter) radial-gradient(#ffffff99 2px,transparent 2.6px) 0 0/18px 18px;border:2px solid var(--butter-d);box-shadow:0 4px 0 var(--butter-d);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.memory-card .back{display:grid;place-items:center;width:52%;aspect-ratio:1;border-radius:50%;background:#fff;font-family:var(--play);font-size:clamp(24px,4vw,38px);color:#C9A14D}
.memory-card.flipped{background:#fff;border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.memory-card.matched{background:var(--sage);border-color:var(--sage-d);box-shadow:0 4px 0 var(--sage-d);animation:pop .3s}
.memory-card .face{display:block;width:70%;flex:1;min-height:0}
.memory-card small{font-size:15px}

/* 두더지 잡기 */
.mole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:600px;margin:auto}
.hole{position:relative;aspect-ratio:1.25;overflow:hidden;isolation:isolate}
.hole:before{content:'';position:absolute;left:5%;right:5%;bottom:5%;height:34%;background:#B8977C;border:6px solid #E8D6C0;border-radius:50%;z-index:-1}
.mole{position:absolute;left:17%;width:66%;height:84%;bottom:13%;transform:translateY(115%);transition:transform .16s ease-out;pointer-events:none}
.hole.up .mole{transform:translateY(0)}
.hole.hit:after{content:'+5';position:absolute;top:14%;left:0;right:0;text-align:center;font-family:var(--play);font-size:30px;color:var(--sage-deep);animation:pop .3s}

/* 풍선 터뜨리기 */
.target-prompt{display:flex;align-items:center;gap:12px;font-size:20px}
.target-block{display:grid;place-items:center;width:68px;height:68px;border-radius:20px;background:var(--butter);border:2px solid var(--butter-d);font-family:var(--play);font-size:38px}
.balloon-stage{position:relative;height:min(58vh,500px);min-height:340px;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse 54px 18px at 20% 14%,#ffffffcc 95%,transparent),radial-gradient(ellipse 70px 20px at 76% 24%,#ffffffb3 95%,transparent),linear-gradient(#D7E9F3,#F3F8FA)}
.balloon{position:absolute;bottom:-150px;left:var(--x);width:86px;height:106px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:var(--balloon);font-family:var(--play);font-size:36px;color:var(--ink);box-shadow:inset -8px -10px 0 #0000000c;animation:floatUp var(--duration) linear forwards;z-index:1}
.balloon:before{content:'';position:absolute;top:15px;left:16px;width:12px;height:22px;border-radius:50%;background:#ffffff8c;transform:rotate(22deg)}
.balloon:after{content:'';position:absolute;top:104px;left:50%;width:1.5px;height:46px;background:#9DB2BB}
.balloon.wrong{animation-play-state:paused;opacity:.45}

/* 동물들의 주문 받기 */
.order-scene{display:flex;justify-content:center;align-items:center;gap:22px;margin:4px 0 24px}
.animal{width:140px;height:140px;flex-shrink:0}
.speech{position:relative;display:inline-flex;align-items:center;gap:.35em;white-space:nowrap;background:var(--blush);border-radius:26px;padding:.5em 1em;font-size:clamp(20px,3vw,28px);line-height:1.3}
.speech:before{content:'';position:absolute;left:-15px;top:50%;transform:translateY(-50%);border:11px solid transparent;border-left:0;border-right:16px solid var(--blush)}
.order-what{font-family:var(--play);font-size:1.22em}
.order-what strong{font-weight:400;font-size:1.08em}
.food-preview{display:block;flex-shrink:0;width:1.9em;height:1.9em}
.food-shelf{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.food{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:104px;padding:12px 10px 10px;background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--line)}
.food:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.food span{width:64px;height:64px}
.food small{font-size:16px}
.basket{margin:24px auto 18px;max-width:600px;min-height:100px;background:#FBF1DE;border:2px dashed #E0C79C;border-radius:22px 22px 44px 44px;padding:16px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.basket .basket-item{width:58px;height:58px;padding:2px;border:0;background:none;border-radius:16px;animation:pop .25s;transition:transform .18s,opacity .18s}
.basket .basket-item .drawn-art{width:100%;height:100%;pointer-events:none}
.basket .basket-item:active{transform:scale(.88)}
.basket .basket-item.leaving{transform:scale(.2);opacity:0}
.order-remind .remind-title{margin:0 0 6px;font-size:18px;color:#8B7565}
.remind-pics{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:300px;margin:4px auto 6px}
.remind-pics span{width:52px;height:52px}
.remind-pics .drawn-art{width:100%;height:100%}
.remind-order{margin:4px 0;font-size:24px}
.remind-tip{margin:8px 0 18px;font-size:19px;line-height:1.55;color:#6E5D52}
.order-remind .modal-actions{display:flex;justify-content:center}
.basket .basket-empty{font-size:17px;color:#A68D69}
.order-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

/* 징검다리 건너기 */
.bridge-target{font-size:18px}
.bridge-target strong{display:inline-grid;place-items:center;min-width:48px;height:48px;padding:0 8px;margin-left:8px;border-radius:14px;background:var(--butter);font-family:var(--play);font-size:26px;vertical-align:middle}
.progress{height:8px;border-radius:8px;background:#EFE8DE;overflow:hidden;max-width:420px;margin:0 auto 20px}
.progress div{height:100%;background:var(--sage-d);transition:width .3s}
.journey{position:relative;height:480px;overflow:hidden;border-radius:26px;background:repeating-linear-gradient(176deg,#D3EAF2 0 44px,#DEF0F6 44px 50px);isolation:isolate}
.journey:before,.journey:after{content:'';position:absolute;top:0;bottom:0;width:9%;background:#CFE3C6;z-index:3;pointer-events:none}
.journey:before{left:0;border-radius:0 40% 40% 0}
.journey:after{right:0;border-radius:40% 0 0 40%}
.river-world{position:absolute;left:0;right:0;bottom:0;transition:transform .65s ease-in-out}
.journey-row{position:absolute;left:9%;width:82%;height:80px;display:flex;justify-content:space-evenly;align-items:center;gap:12px}
.journey-row .stone{position:relative;flex:0 1 120px;min-height:74px;border-radius:46% 50% 42% 48%/50% 46% 52% 44%;background:#fff;border:2px solid #CFC6BA;box-shadow:0 5px 0 #A9BDB8;font-family:var(--play);font-size:32px;z-index:2}
.journey-row .stone:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 #A9BDB8}
.journey-row .stone:disabled{opacity:.35}
.journey-row .stone.done{opacity:1;background:var(--sage);border-color:var(--sage-d);box-shadow:0 5px 0 var(--sage-d)}
.ghost-stone{width:24%;max-width:100px;height:52px;border-radius:46%;background:#ffffff66;border:2px dashed #A9CBD8;color:transparent}
.journey-row.active-row:before{content:'다음 돌을 골라요';position:absolute;top:-30px;left:0;right:0;text-align:center;font-size:15px;color:#4F7280}
.river-dock{position:absolute;left:22%;width:56%;height:84px;border-radius:18px;background:repeating-linear-gradient(90deg,#EFD9B9 0 30px,#E3C9A3 30px 32px);border:2px solid #D9BE95;text-align:center;padding-top:10px;font-size:19px;color:#6B5340}
.river-dock.start{bottom:0}
.journey-rabbit{position:absolute;width:64px;height:76px;left:50%;bottom:30px;transform:translateX(-50%);transition:left .5s ease,bottom .5s ease;z-index:5;pointer-events:none}
.journey-rabbit.hopping .drawn-art{animation:rabbit-hop .5s ease-in-out}
.journey-note{text-align:center;color:var(--muted);font-size:14px;margin-top:12px}

/* 쉬기 · 알림 · 결과 */
.paused-banner{position:absolute;inset:0;z-index:10;background:#FBF7F1F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.paused-banner h2{font-family:var(--play);font-size:30px}
.paused-pic{width:110px;height:110px}
.feedback-popup{position:fixed;inset:0;z-index:18;display:grid;place-items:center;padding:24px;pointer-events:none}
.feedback-card{max-width:400px;background:#fff;border-radius:28px;box-shadow:0 18px 50px #4B3F3A2b;padding:22px 30px 26px;text-align:center;font-size:22px;line-height:1.5;animation:pop .2s}
.feedback-icon{display:block;width:84px;height:84px;margin:0 auto 6px}
.feedback-popup.leaving{opacity:0;transition:opacity .15s}
.modal-backdrop{position:fixed;inset:0;z-index:20;background:#4B3F3A59;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:32px;box-shadow:0 24px 70px #4B3F3A40;padding:26px 30px 30px;text-align:center;width:100%;max-width:460px;max-height:94dvh;overflow:auto;animation:pop .3s}
.reward-stars{display:flex;gap:8px;justify-content:center;align-items:center;height:76px}
.reward-star{width:60px;height:60px;overflow:visible}
.reward-star:nth-child(2){width:72px;height:72px}
.reward-star path{stroke-width:4;stroke-linejoin:round}
.reward-star.earned{animation:twinkle 1.6s ease-in-out var(--delay) 2}
.reward-star.earned path{fill:#F6D77E;stroke:#E2B955}
.reward-star.empty path{fill:none;stroke:#E6DDD2}
.reward-modal h2{font-family:var(--play);font-size:34px;margin:10px 0 0}
.reward-mascot{width:118px;height:118px;margin:6px auto}
.reward-achievement{font-size:21px}

/* 새로 생긴 놀이 */
.paint-palette,.studio-tools,.phone-friends{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.swatch{width:52px;height:52px;border-radius:50%;background:var(--paint);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line),0 3px 0 var(--line);color:#fff;font-size:22px;text-shadow:0 1px 2px #0006}
.swatch[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.08)}
.studio-tools .soft-btn[aria-pressed=true],.phone-friends .soft-btn[aria-pressed=true]{background:var(--hue);border-color:var(--hue-d);box-shadow:0 3px 0 var(--hue-d)}
#art-canvas{display:block;width:100%;max-width:800px;height:auto;aspect-ratio:4/3;margin:auto;background:#fff;border-radius:22px;border:2px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.reward-modal>.soft-btn{margin-top:12px}
.puzzle-layout{display:grid;grid-template-columns:minmax(0,440px) 140px;justify-content:center;gap:22px;align-items:center}
.puzzle-board{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);aspect-ratio:1;background:#fff;border:3px solid var(--hue-d);border-radius:18px;overflow:hidden}
.puzzle-slot{min-width:0;min-height:0;border-radius:0;background-color:#FBF7F1;background-repeat:no-repeat;outline:1.5px dashed var(--line);outline-offset:-1px;font-family:var(--play);font-size:24px;color:#CDBFB0}
.puzzle-slot:disabled{outline:0;background-color:#fff}
.puzzle-layout .center{text-align:center;color:var(--muted);font-size:15px;margin-bottom:6px}
.puzzle-reference{background:var(--hue);border-radius:18px;padding:10px}
.puzzle-reference .drawn-art{height:auto}
.puzzle-tray{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:12px;max-width:440px;margin:18px auto 0}
.puzzle-piece{aspect-ratio:var(--rows)/var(--cols);background-color:#fff;background-repeat:no-repeat;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.puzzle-piece[aria-pressed=true]{border-color:var(--hue-d);box-shadow:0 0 0 3px var(--hue-d)}
/* 퍼즐 모양 조각 */
.shape-ico{width:64px;height:64px;fill:none;stroke:#5E4E44;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.puzzle-board.jig{display:block;background:#fff}
.jig-svg{display:block;width:100%;height:100%}
.jig-slot{fill:#FBF7F1;stroke:#CDBBAA;stroke-width:1.6;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s}
.jig-svg,.jig-svg path{-webkit-tap-highlight-color:transparent}
.jig-slot:focus{outline:none}
.jig-slot:focus-visible{outline:none;stroke:var(--hue-d);stroke-width:3;stroke-dasharray:none}
.jig-slot.nope{fill:#F7DCD7}
.jig-base{fill:#FFFDF8}
.jig-edge{fill:none;stroke:#B9A392;stroke-width:1.6;vector-effect:non-scaling-stroke;transition:stroke .8s}
.jig-in{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:pop .35s}
.jig-svg.complete .jig-edge{stroke:transparent}
.puzzle-tray.jig{gap:4px}
.puzzle-tray.jig .puzzle-piece{aspect-ratio:auto;padding:0;background:none!important;border:0;box-shadow:none;border-radius:0;transition:transform .15s}
.puzzle-tray.jig .puzzle-piece svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 3px 0 rgba(112,91,76,.28))}
.puzzle-tray.jig .puzzle-piece .jig-edge{stroke:#8B7565;stroke-width:2}
.puzzle-tray.jig .puzzle-piece[aria-pressed=true]{transform:scale(1.08)}
.puzzle-tray.jig .puzzle-piece[aria-pressed=true] .jig-edge{stroke:var(--hue-d);stroke-width:4.5}
.puzzle-tray.jig .puzzle-piece.used{visibility:hidden}
.puzzle-tray.jig .puzzle-piece.nope{animation:shadow-shake .4s}

.shadow-img{filter:brightness(0) invert(.48) sepia(1) saturate(1.1) hue-rotate(-20deg) brightness(.75)}
.shadow-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:center;max-width:900px;margin:0 auto}
.shadow-big{position:relative;display:block;width:100%;max-width:380px;aspect-ratio:1;margin:0 auto;border-radius:30px;background:var(--hue) radial-gradient(#ffffffaa 2px,transparent 2.6px) 0 0/20px 20px;border:2px solid var(--hue-d);box-shadow:0 5px 0 var(--hue-d)}
.shadow-dark,.shadow-real{position:absolute;inset:11%;display:block;transition:opacity .35s}
.shadow-dark .drawn-art,.shadow-real .drawn-art{width:100%;height:100%}
.shadow-real{opacity:0}
.shadow-big.revealed .shadow-dark{opacity:0}
.shadow-big.revealed .shadow-real{opacity:1;animation:shadow-hop 1.1s ease-out}
@keyframes shadow-hop{0%{transform:scale(.85)}20%{transform:scale(1.08)}38%{transform:translateY(-9%) scale(1.04)}52%{transform:translateY(0) scale(1)}66%{transform:translateY(-5%)}80%{transform:translateY(0)}100%{transform:none}}
.shadow-big.cheer{animation:shadow-glow 1.2s ease-out}
@keyframes shadow-glow{0%{box-shadow:0 5px 0 var(--hue-d),0 0 0 0 #F6D77E}35%{box-shadow:0 5px 0 var(--hue-d),0 0 0 14px #F6D77Ecc}100%{box-shadow:0 5px 0 var(--hue-d),0 0 0 26px #F6D77E00}}
.shadow-spark{position:absolute;left:50%;top:50%;z-index:2;background:var(--c);pointer-events:none;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:shadow-spark 1s ease-out forwards}
@keyframes shadow-spark{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.1) rotate(200deg);opacity:0}}
.shadow-cheer{position:absolute;left:50%;bottom:-26px;z-index:3;display:flex;align-items:center;gap:6px;padding:6px 24px;background:#fff;border:3px solid #F2C14E;border-radius:999px;box-shadow:0 4px 0 #E8CF86;font-family:var(--play);font-size:clamp(24px,3.4vw,36px);color:#C9851F;white-space:nowrap;transform:translateX(-50%);animation:shadow-cheer .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes shadow-cheer{0%{transform:translateX(-50%) scale(0) rotate(-12deg)}100%{transform:translateX(-50%) scale(1)}}
.shadow-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.shadow-options[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.shadow-opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;padding:12px 8px 10px;background:#fff;border:2px solid var(--line);border-radius:24px;box-shadow:0 4px 0 var(--line);transition:opacity .25s}
.shadow-opt:not(.out):active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.shadow-opt-pic{display:block;width:100%;max-width:130px;aspect-ratio:1}
.shadow-opt-pic .drawn-art{width:100%;height:100%}
.shadow-opt strong{font-family:var(--play);font-size:21px;font-weight:400}
.shadow-opt{position:relative}
.shadow-opt.right{background:var(--sage);border-color:var(--sage-d);box-shadow:0 4px 0 var(--sage-d);animation:pop .45s}
.shadow-opt.right:after{content:'✓';position:absolute;top:8px;right:8px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sage-deep);color:#fff;font-size:18px;font-weight:700;animation:pop .4s}
.shadow-opt.out{opacity:.35;cursor:default}
.shadow-opt.nope{animation:shadow-shake .4s}
@keyframes shadow-shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shadow-dots{display:inline-flex;align-items:center;gap:8px;padding:13px 18px}
.shadow-dots i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--hue-d)}
.shadow-dots i.now{background:var(--hue-d)}
.shadow-dots i.done{width:20px;height:20px;margin:-3px;background:#F2C14E;box-shadow:none;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.shadow-dots i.just{animation:shadow-star .6s}
@keyframes shadow-star{0%{transform:scale(.2) rotate(-90deg)}60%{transform:scale(1.7) rotate(10deg)}100%{transform:scale(1)}}
.shadow-card{position:relative;display:block;width:100%;height:100%}
.shadow-card-dark,.shadow-card-color{position:absolute;display:block}
.shadow-card-dark{inset:0}
.shadow-card-color{width:62%;height:62%;right:-46%;bottom:-6%}
.shadow-card .drawn-art{width:100%;height:100%}
@media(max-width:760px){.shadow-layout{grid-template-columns:1fr;gap:34px}.shadow-big{max-width:290px}}
@media(max-width:480px){.shadow-big{max-width:230px}.shadow-options{gap:10px}.shadow-options[data-n="3"]{gap:8px}.shadow-opt{padding:8px 4px}.shadow-opt-pic{max-width:92px}.shadow-opt strong{font-size:18px}}

/* 맞혔을 때 축하 (여러 놀이 함께) */
.cheer-layer{position:fixed;z-index:15;width:0;height:0;pointer-events:none}
.cheer-spark{position:absolute;left:0;top:0;background:var(--c);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:shadow-spark .9s ease-out forwards}
.cheer-word{position:absolute;left:var(--dx,0px);top:var(--dy,0px);padding:4px 16px;background:#fff;border:3px solid #F2C14E;border-radius:999px;box-shadow:0 4px 0 #E8CF86;font-family:var(--play);font-size:22px;color:#C9851F;white-space:nowrap;transform:translate(-50%,-100%);animation:cheer-word 1.1s ease-out forwards}
.cheer-layer.big .cheer-word{padding:6px 24px;font-size:clamp(26px,3.6vw,38px);animation-duration:1.75s}
@keyframes cheer-word{0%{transform:translate(-50%,-100%) scale(0) rotate(-10deg)}18%{transform:translate(-50%,-100%) scale(1.15)}30%{transform:translate(-50%,-100%) scale(1)}72%{opacity:1}100%{transform:translate(-50%,-150%);opacity:0}}
.reward-mascot.wide{width:240px;height:180px;border-radius:14px;overflow:hidden}

/* 놀이 종류별 묶음 */
.game-group+.game-group .section-top{margin-top:40px}
.games.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.games.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.games .game-card{min-width:0}
.games.n4 .game-card,.games.n3 .game-card{grid-column:auto}
.games.n4 .card-pic{width:76px;height:76px}.games.n4 .card-pic.small{width:50px;height:50px}
.games.n4 .card-stones i{width:36px;height:30px;font-size:17px}
.games.n4 .game-card h3{font-size:21px}
@media(max-width:900px){.games.n4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.games.n3{grid-template-columns:repeat(2,minmax(0,1fr))}.games.n3 .game-card:last-child{grid-column:span 2}.games.n4 .game-card:last-child{grid-column:auto}}
@media(max-width:480px){.games .card-pic{width:64px;height:64px}.games .card-pic.small{width:40px;height:40px}.games .card-stones i{width:30px;height:26px;font-size:15px}.games .card-stones{gap:4px}}
.card-art .card-pic{flex-shrink:0}
.game-card.soon .card-art:after{content:'';position:absolute;inset:0;background:rgba(94,78,68,.16);pointer-events:none}
.game-card.soon .card-cover{filter:grayscale(.65);opacity:.6}
.game-card.soon h3{color:var(--muted)}
.soon-badge{position:absolute;z-index:1;top:10px;right:10px;padding:3px 11px;border-radius:999px;background:rgba(94,78,68,.82);color:#fff;font-size:13px;line-height:1.5}
.card-art .card-cover{display:block;width:100%;height:100%;object-fit:contain;padding:6px 8px;transition:transform .2s}
.game-card:active .card-cover{transform:scale(.95)}
@media(max-width:480px){[data-game=bridge] .card-pic{width:54px;height:54px}[data-game=bridge] .card-stones i:nth-child(3){display:none}}

.foot-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.news-link svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.news-modal{text-align:left;max-width:500px}
.news-intro{margin:0 0 18px;padding:16px 18px;background:#FBF1DE;border-radius:18px;font-size:17px;line-height:1.7;color:#5E4E44;word-break:keep-all}
.news-intro p{margin:0}
.news-intro p+p{margin-top:10px}
.news-modal h2{font-family:var(--play);font-size:28px;text-align:center;margin-bottom:14px}
.news-list{max-height:52vh;overflow-y:auto;margin-bottom:18px}
.news-list article+article{margin-top:16px;padding-top:16px;border-top:1.5px dashed var(--line)}
.news-list h3{font-family:var(--play);font-size:18px;color:var(--sage-deep);margin-bottom:6px}
.news-list ul{margin:0;padding-left:20px;display:grid;gap:6px;font-size:16px;line-height:1.55}
.news-modal .primary{display:flex;margin:0 auto;min-width:200px}
.puzzle-slot.filled{outline:0;background-color:#fff;background-repeat:no-repeat}
.puzzle-slot.filled:active{opacity:.8}
.puzzle-piece.used{background-image:none!important;background-color:transparent;border-style:dashed;box-shadow:none}

/* ===== 가로 화면(태블릿 가로·낮은 화면) 맞춤 ===== */
@media (orientation:landscape) and (min-width:700px) and (max-height:920px){
 .app{padding-top:10px;padding-bottom:24px}
 header{margin-bottom:8px}
 .brand-icon{width:40px;height:40px}.brand-icon .drawn-art{width:36px;height:36px}.brand{font-size:20px}
 header .soft-btn{min-height:42px;padding:6px 14px;font-size:15px}
 .game-head{margin-bottom:8px;align-items:center}
 .game-head h2{font-size:26px}.game-head p{display:none}
 .game-head .soft-btn{min-height:42px;padding:6px 14px}
 .controls{margin-bottom:8px}.controls .soft-btn{min-height:42px;padding:6px 14px;font-size:15px}
 .stage{padding:14px 18px;min-height:0;--avail:max(300px,calc(100dvh - 150px))}
 .controls+.stage{--avail:max(300px,calc(100dvh - 200px))}
 .status{margin-bottom:10px}.stat{padding:6px 16px;font-size:16px}
 .hint{margin-top:10px;font-size:17px;min-height:26px}
 .start-panel{min-height:calc(var(--avail) - 10px);gap:10px}.start-pic{width:110px;height:110px}
 /* 고르기 화면 */
 .setup-screen h3{margin:14px 4px 8px}.choice-block{min-height:108px;padding:10px 8px}.choice-picture{height:56px}.choice-picture .drawn-art{width:56px;height:56px}.setup-start{margin-top:18px}
 .page-grid{grid-template-columns:repeat(8,1fr);gap:10px;margin-top:12px}.page-pick strong{font-size:14px}
 .scene-grid{max-width:640px;margin:12px auto 0}

 /* 색칠하기 · 그림 그리기: 그림은 왼쪽, 도구는 오른쪽 */
 .stage:has(> #art-canvas){display:grid;grid-template-columns:auto minmax(230px,1fr);grid-template-rows:auto auto 1fr auto;column-gap:22px;align-items:start}
 .stage:has(> #art-canvas)>#art-canvas{grid-column:1;grid-row:1/-1;height:var(--avail);width:auto;max-width:none;margin:0}
 .stage:has(> #art-canvas)>.paint-palette{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(auto-fill,44px);justify-content:start;gap:8px;margin:0 0 10px}
 .stage:has(> #art-canvas) .swatch{width:44px;height:44px;font-size:18px}
 .stage:has(> #art-canvas)>.studio-tools{gap:6px}
 .stage:has(> #art-canvas)>.studio-tools .soft-btn{min-height:40px;padding:5px 12px;font-size:14px}
 .stage:has(> #art-canvas) .brush-dot{width:44px;height:44px}
 .stage:has(> #art-canvas)>.studio-tools{grid-column:2;grid-row:2;justify-content:flex-start;margin:0}
 .stage:has(> #art-canvas)>.done-row{grid-column:2;grid-row:3;align-self:end;justify-content:flex-start;margin:0}
 .stage:has(> #art-canvas)>.hint{grid-column:2;grid-row:4;text-align:left}
 .stage:has(> #art-canvas) .done-row .primary{min-width:0;width:100%}

 .stage:has(> #art-canvas)>#art-canvas:not(.color-canvas){--ch:min(var(--avail),calc((min(100vw,1080px) - 420px) * .75));height:var(--ch);width:calc(var(--ch) * 4 / 3)}
 .stage:has(> #art-canvas)>#art-canvas.color-canvas{--cs:min(var(--avail),calc(min(100vw,1080px) - 420px));width:var(--cs);height:var(--cs)}
 /* 퍼즐: 판은 왼쪽, 조각은 오른쪽 */
 .stage:has(> .puzzle-layout){display:grid;grid-template-columns:auto minmax(240px,1fr);grid-template-rows:auto auto 1fr;column-gap:24px;align-items:start}
 .stage:has(> .puzzle-layout)>.puzzle-layout{--pb:min(var(--avail),calc(min(100vw,1080px) - 520px));grid-column:1;grid-row:1/-1;grid-template-columns:var(--pb) 96px;gap:14px}
 .stage:has(> .puzzle-layout) .puzzle-board{width:var(--pb)}
 .stage:has(> .puzzle-layout)>.status{grid-column:2;grid-row:1;justify-content:flex-start}
 .stage:has(> .puzzle-layout)>.puzzle-tray{grid-column:2;grid-row:2;margin:0;max-width:340px;gap:10px}
 .stage:has(> .puzzle-layout)>.puzzle-tray.jig{max-width:none;gap:4px}
 .stage:has(> .puzzle-layout)>.hint{grid-column:2;grid-row:3;text-align:left}

 /* 그림자 맞추기: 그림자는 왼쪽, 고르는 그림은 오른쪽 */
 .shadow-big{max-width:min(400px,max(180px,calc(var(--avail) - 110px)))}
 .shadow-options[data-n="4"] .shadow-opt-pic{max-width:max(56px,min(130px,calc((var(--avail) - 250px) / 2)))}
 .shadow-opt{padding:8px 6px}
 .shadow-dots{padding:9px 14px}

 /* 같은 그림 찾기 · 두더지 · 풍선 · 징검다리: 화면 높이에 맞추기 */
 .memory-grid{max-width:min(750px,calc((var(--avail) - 90px) / var(--rows,2) * var(--cols,2)))!important;gap:10px}
 .mole-grid{max-width:min(600px,calc((var(--avail) - 80px) * 1.2))}
 .balloon-stage{height:calc(var(--avail) - 120px);min-height:240px}
 .journey{height:max(260px,calc(var(--avail) - 170px))}
 .progress{margin-bottom:10px}

 /* 주문 받기: 손님은 왼쪽, 과일과 바구니는 오른쪽 */
 .stage:has(> .order-scene){display:grid;grid-template-columns:1fr 1fr;grid-template-areas:'status shelf' 'scene basket' 'scene actions' 'scene hint';column-gap:24px;align-items:center}
 .stage:has(> .order-scene)>.status{grid-area:status;margin:0}
 .stage:has(> .order-scene)>.order-scene{grid-area:scene;flex-direction:column;gap:14px;margin:0}
 .stage:has(> .order-scene) .speech:before{left:50%;top:-15px;transform:translateX(-50%);border:11px solid transparent;border-top:0;border-bottom:16px solid var(--blush)}
 .stage:has(> .order-scene)>.food-shelf{grid-area:shelf;gap:8px}
 .stage:has(> .order-scene) .food{min-width:76px;padding:8px 6px}.stage:has(> .order-scene) .food span{width:50px;height:50px}
 .stage:has(> .order-scene) .animal{width:130px;height:130px}
 .stage:has(> .order-scene) .basket{min-height:80px}
 .stage:has(> .order-scene)>.basket{grid-area:basket;margin:12px 0;width:100%}
 .stage:has(> .order-scene)>.order-actions{grid-area:actions}
 .stage:has(> .order-scene)>.hint{grid-area:hint}

 /* 전화기 */
 .phone-layout{gap:18px}
 .toy-phone{padding:14px 16px;border-radius:30px}
 .call-pic{width:60px;height:60px}
 .toy-phone .phone-target{min-height:22px;font-size:15px}
 .phone-display{min-height:48px;padding:8px;margin:8px 0;font-size:22px}
 .phone-keys{gap:8px;margin-bottom:10px}.phone-keys button{min-height:46px;font-size:24px}
 .toy-phone .call-line{font-size:14px;padding:6px 10px;margin:-2px 0 8px}
 .book-entry{padding:4px 8px 4px 4px}.book-pic{width:36px;height:36px}.book-pic .drawn-art{width:32px;height:32px}.book-num{font-size:19px}
 .phone-book h3{font-size:17px;margin-bottom:6px}.book-list{gap:6px;margin-bottom:10px}

 /* 옷입히기 */
 .dress-scene{padding:12px}
 .doll{height:min(430px,calc(var(--avail) - 60px))}
 .wardrobe h3{font-size:17px;margin-bottom:6px}.wardrobe-grid{gap:8px;margin-bottom:10px}.wear-pic{height:46px}.wear{padding:6px 4px 4px}
}

/* 옷입히기: 친구 고르기 · 맞추기 모드 */
.friend-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.friend{width:60px;height:60px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);padding:4px;overflow:hidden}
.friend .drawn-art{width:100%;height:100%}
.friend[aria-pressed=true]{background:var(--hue);border-color:var(--hue-d);box-shadow:0 3px 0 var(--hue-d)}
.friend:not(:disabled):active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.dress-layout .wardrobe-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
#doll-wrap{display:flex;justify-content:center}
.doll{aspect-ratio:auto}
.fit-panel{margin-top:14px;padding:12px;border:2px dashed #7FA6C9;border-radius:16px;background:#F4F9FC;display:flex;flex-direction:column;gap:8px;font-size:14px}
.fit-panel select{font-size:15px;padding:6px;border-radius:8px}
.fit-btns{display:flex;flex-wrap:wrap;gap:6px}

@media(max-width:480px){.dress-layout .wardrobe-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.friend{width:50px;height:50px}}
@media (orientation:landscape) and (min-width:700px) and (max-height:920px){.friend{width:46px;height:46px}.friend-row{margin-bottom:6px}.dress-layout .wardrobe-grid{gap:6px}}

/* 풍선 그림 */
.balloon{width:86px;height:146px;border-radius:0;background:center top/100% auto no-repeat;box-shadow:none;display:flex;align-items:flex-start;justify-content:center;padding:36px 0 0;line-height:1}
.balloon:before,.balloon:after{display:none}
.balloon-pop{position:absolute;width:130px;height:auto;transform:translate(-50%,-50%) scale(.4);pointer-events:none;z-index:3;animation:pop-burst .5s ease-out forwards}
@keyframes pop-burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}60%{transform:translate(-50%,-50%) scale(1.1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
.card-balloon{width:66px;height:112px;border-radius:0;background-color:transparent!important;background-position:center top!important;background-size:100% auto!important;background-repeat:no-repeat!important;align-items:start;padding-top:22px;margin-top:4px}
.card-balloon:after{display:none}
@media(max-width:480px){.balloon{width:70px;height:119px;padding-top:28px;font-size:30px}.card-balloon{width:48px;height:82px;padding-top:15px;font-size:22px}}
@media(prefers-reduced-motion:reduce){.balloon-pop{animation:none;opacity:0}}
@media (orientation:landscape) and (min-width:700px) and (max-height:920px){
 .dress-layout{gap:16px;align-items:start}
 .wardrobe h3{font-size:15px;margin:0 2px 4px}
 .friend{width:40px;height:40px;padding:2px}.friend-row{gap:6px;margin-bottom:6px}
 .dress-layout .wardrobe-grid{gap:5px;margin-bottom:6px}
 .wear{padding:3px 2px 2px;border-radius:12px}.wear-pic{height:34px}.wear-name{font-size:12px}
 .dress-layout .studio-tools{margin-top:4px}.dress-layout .studio-tools .primary{min-height:46px;font-size:19px;padding:8px 22px}.dress-layout .studio-tools .soft-btn{min-height:42px}
 .stage:has(> .dress-layout)>.hint{display:none}
}

#phone-end{background:#EC7A6A;color:#fff;border-color:#D9604F;box-shadow:0 3px 0 #C9503F;font-family:var(--play)}
#phone-end:not(:disabled):active{box-shadow:0 0 0 #C9503F}

.book-name{font-size:18px;color:var(--ink);font-family:var(--play);line-height:1.15}
@media(max-width:760px){.book-name{font-size:15px}}
@media (orientation:landscape) and (min-width:700px) and (max-height:920px){.book-name{font-size:16px}}

/* 징검다리 그림 */
.journey{background:url("images/bridge/journey.webp") center 0/100% auto repeat-y!important;transition:background-position .65s ease-in-out}
.journey:before,.journey:after{display:none}
.journey-row .stone{flex:0 1 165px;min-height:0;aspect-ratio:2.1/1;border:0;border-radius:0;box-shadow:none;background:url("images/bridge/stone.webp") center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;padding:0 0 10px;line-height:1;color:var(--ink)}
.journey-row .stone.s1{background-image:url("images/bridge/stone-s1.webp")}
.journey-row .stone.s2{background-image:url("images/bridge/stone-s2.webp")}
.journey-row .stone:not(:disabled):active{transform:translateY(3px);box-shadow:none}
.journey-row .stone:disabled{opacity:.55}
.journey-row .stone.done{opacity:1;background:url("images/bridge/stone-done.webp") center/100% 100% no-repeat;border:0;box-shadow:none}
.ghost-stone{width:24%;max-width:135px;height:auto;aspect-ratio:2.1/1;border:0;border-radius:0;background:url("images/bridge/stone.webp") center/100% 100% no-repeat;opacity:.35}
.ghost-stone:nth-child(2){background-image:url("images/bridge/stone-s2.webp")}
.journey-row.active-row:before{color:#3F6577;font-family:var(--play);font-size:16px}
.river-dock{border:0;border-radius:0;background:url("images/bridge/river-dock.webp") center/100% 100% no-repeat;display:grid;place-items:center;padding:0 0 12px;font-family:var(--play);font-size:21px;color:#6B5340}
@media(max-width:480px){.journey-row .stone{font-size:26px}.river-dock{font-size:18px}}
@media(max-width:480px){.journey-row .stone{padding-bottom:7px}}

/* 숨은 그림 찾기 */
.hidden-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.page-pick[aria-pressed=true]{background:var(--hue);border-color:var(--hue-d);box-shadow:0 4px 0 var(--hue-d)}
.hidden-levels{grid-template-columns:repeat(2,1fr);max-width:480px;margin:0 auto}
.hidden-card{position:relative;display:block;width:110px;height:110px;background:#fff;border-radius:14px;overflow:hidden}
.hidden-card img{width:100%;height:100%;display:block}
.hidden-card svg{position:absolute;right:-6px;bottom:-6px;width:58px;height:58px;fill:#ffffffcc;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.card-art .card-pic:has(.hidden-card){width:auto;height:auto}
.hidden-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:680px;margin:auto}
.hidden-board{position:relative;width:100%;aspect-ratio:1;background:#fff;border-radius:20px;border:2px solid var(--line);overflow:hidden;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.hidden-board img{display:block;width:100%;height:100%;pointer-events:none}
.h-found{position:absolute;border:5px solid #F08A7A;border-radius:50%;box-shadow:0 0 0 3px #ffffffaa;animation:pop .35s;pointer-events:none}
.h-miss{position:absolute;border:3px solid #B9A9DA;border-radius:50%;opacity:.8;animation:h-miss .45s ease-out forwards;pointer-events:none}
@keyframes h-miss{to{transform:scale(1.6);opacity:0}}
.h-help{position:absolute;border-radius:50%;background:#FBEBBB88;border:3px dashed #E5BE5C;animation:h-help 1.6s ease-in-out;pointer-events:none}
@keyframes h-help{0%,100%{opacity:0}20%,80%{opacity:1}}
.hidden-side .status{justify-content:center}
.find-title{text-align:center;font-family:var(--play);font-size:18px;margin-bottom:8px}
.find-list{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.find-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;padding:8px 4px 6px;background:#fff;border:2px solid var(--line);border-radius:16px}
.find-pic{width:52px;height:52px}.find-pic img{width:100%;height:100%;display:block}
.find-name{font-family:var(--play);font-size:15px}
.find-item.found{background:var(--sage);border-color:var(--sage-d)}
.find-item.found:after{content:'✓';position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--sage-deep);color:#fff;font-size:14px;line-height:24px;text-align:center}
@media(max-width:480px){.find-item{width:70px}.find-pic{width:42px;height:42px}.find-name{font-size:13px}.hidden-card{width:80px;height:80px}.hidden-card svg{width:44px;height:44px}}
@media (orientation:landscape) and (min-width:700px) and (max-height:920px){
 .stage:has(> .hidden-layout){display:block}
 .hidden-layout{grid-template-columns:auto minmax(240px,1fr);max-width:none;align-items:start;gap:22px}
 .hidden-board{--hb:min(var(--avail),calc(min(100vw,1080px) - 420px));width:var(--hb);height:var(--hb)}
 .hidden-side .status{justify-content:flex-start}.find-title{text-align:left}.find-list{justify-content:flex-start}
 .hidden-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
}
@media (min-width:900px) and (min-height:921px){.hidden-layout{grid-template-columns:minmax(0,560px) minmax(240px,1fr);max-width:none;align-items:start}}
/* 꾹 누르기 버튼: 누르는 동안 색이 차오르고, 다 차면 손을 뗄 때 실행 */
.hold{position:relative;overflow:hidden;isolation:isolate}
.hold::after{content:'';position:absolute;inset:0;z-index:-1;background:var(--sage);transform:scaleX(0);transform-origin:left center;pointer-events:none}
.hold.holding::after{transform:scaleX(1);transition:transform var(--hold-ms,1000ms) linear}
.hold.ready::after{transform:scaleX(1);background:var(--sage-d)}
.hold.nudge{animation:holdNudge .4s ease}
@keyframes holdNudge{20%{translate:-4px 0}40%{translate:4px 0}60%{translate:-3px 0}80%{translate:2px 0}}
@media(prefers-reduced-motion:reduce){.hold.holding::after{transition:none}.hold.nudge{animation:none}}
.parent-note{margin-top:10px;font-size:13px;color:var(--muted)}
.news-modal{max-height:calc(100dvh - 40px);overflow-y:auto}
.parent-tips{margin:0 0 18px;padding:14px 18px;border:1.5px dashed var(--line);border-radius:18px;font-size:15px;line-height:1.65;color:#5E4E44}
.parent-tips h3{font-family:var(--play);font-size:19px;margin-bottom:6px}
.parent-tips ul{margin:0;padding-left:18px}
.parent-tips li+li{margin-top:4px}
</style>

function showNews(){const old=$('.news-backdrop');if(old)old.remove();const wrap=document.createElement('div');wrap.className='modal-backdrop news-backdrop';wrap.innerHTML=`<section class="modal news-modal" role="dialog" aria-modal="true" aria-labelledby="news-title"><h2 id="news-title">업데이트 소식</h2><div class="news-intro"><p>몽글몽글 놀이방은 광고 없이 태블릿을 잠시 사용할 때 안심하고 놀이할 수 있는 공간입니다.</p><p>불편한 점이나 오류가 있거나 ‘이런 놀이가 있으면 좋겠어요’ 하는 제안이 있는 경우 의견 보내기를 통해 보내주세요!</p></div><div class="parent-tips"><h3>보호자 도움말</h3><ul><li>홈 화면에 추가하면 주소창 없이 앱처럼 열려요. 아이패드·아이폰은 사파리 공유 버튼에서 ‘홈 화면에 추가’를 눌러요. 갤럭시탭 등 안드로이드는 크롬 메뉴(⋮)에서 ‘홈 화면에 추가’를 누른 뒤 ‘앱으로 설치’를 골라요. 다른 옵션(바로가기)을 고르면 주소창이 보여요.</li><li>아이 혼자 쓸 때는 화면 고정을 켜 두세요. 아이패드·아이폰은 설정 › 손쉬운 사용 › 사용법 유도 접근, 안드로이드는 설정에서 ‘앱 고정’을 찾아 켜요.</li><li>소리가 안 나면 기기의 무음 모드와 음량을 확인해 주세요.</li><li>소리 버튼은 1초, 아래 버튼은 3초 꾹 누르고 손을 떼야 눌려요.</li><li>그리던 그림은 자동으로 이어 그리기 저장돼요. 그림 저장을 누르면 갤럭시탭 등 안드로이드는 갤러리(Download 앨범)에 바로 저장되고, 아이패드·아이폰은 뜨는 창에서 ‘이미지 저장’을 한 번 더 누르면 사진첩에 들어가요.</li></ul></div>${siteNews.length?`<div class="news-list">${siteNews.map(([d,items])=>`<article><h3>${d}</h3><ul>${items.map(t=>`<li>${t}</li>`).join('')}</ul></article>`).join('')}</div>`:''}<button class="primary" id="news-close">${ui.check}확인했어요</button></section>`;overlays.append(wrap);const close=()=>{wrap.remove();$('#news-btn').focus()};$('#news-close',wrap).onclick=close;wrap.onclick=e=>{if(e.target===wrap)close()};wrap.onkeydown=e=>{if(e.key==='Escape')close()};$('#news-close',wrap).focus()}
const FEEDBACK_URL='';holdify($('#news-btn'),3000,showNews);const fb=$('#feedback');if(FEEDBACK_URL)fb.href=FEEDBACK_URL;holdify(fb,3000,()=>{if(FEEDBACK_URL)window.open(FEEDBACK_URL,'_blank','noopener');else popup('의견 보내기는 곧 열려요!','🐰')});soundLabel();$('#brand-icon').innerHTML='<img class="drawn-art brand-giraffe" src="images/brand/giraffe.webp" alt="" draggable="false">';
// 방문자 수 세기 (GoatCounter): 쿠키와 개인정보 없이 방문 수와 놀이별 시작 수만 셉니다.
// GoatCounter에서 만든 코드(예: mongle-playroom)를 따옴표 안에 넣으면 켜지고, 비워 두면 꺼져요.

// 사이트를 바꿔 push할 때마다 version.json의 v와 이 값을 같은 새 값으로 올려요 (예: 2026.10.23-2)
const APP_VERSION='2026.10.23-1';let newVersion=null,versionChecking=false;
function versionReload(){if(!newVersion||screen!=='home')return;try{if(sessionStorage.getItem('mongle-reloaded')===newVersion)return;sessionStorage.setItem('mongle-reloaded',newVersion)}catch{return}location.replace('./?v='+encodeURIComponent(newVersion))}
async function versionCheck(){if(versionChecking)return;versionChecking=true;try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=(await r.json()).v;if(typeof v==='string'&&v&&v!==APP_VERSION){newVersion=v;versionReload()}}catch{}finally{versionChecking=false}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')versionCheck()});

versionCheck();
