<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F1"><meta name="description" content="4~6세 어린이를 위한 열 가지 터치 놀이. 기억력, 숫자, 글자를 즐겁게 배워요.">
<title>몽글몽글 놀이방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#FBF7F1;--card:#fff;--ink:#4B3F3A;--muted:#857870;--line:#EADFD2;
 --butter:#FBEBBB;--butter-d:#E8CF86;
 --sage:#DCEBD3;--sage-d:#A6C8A0;--sage-deep:#5F9172;--sage-deeper:#477058;
 --sky:#D7E9F3;--sky-d:#9FC7DD;
 --blush:#F8DDD7;--blush-d:#E6B0A7;
 --lilac:#E6DFF2;--lilac-d:#B8A8DA;
 --hue:var(--sage);--hue-d:var(--sage-d);
 --ui:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
 --play:'Jua','Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
}
[data-hue=butter]{--hue:var(--butter);--hue-d:var(--butter-d)}
[data-hue=sage]{--hue:var(--sage);--hue-d:var(--sage-d)}
[data-hue=sky]{--hue:var(--sky);--hue-d:var(--sky-d)}
[data-hue=blush]{--hue:var(--blush);--hue-d:var(--blush-d)}
[data-hue=lilac]{--hue:var(--lilac);--hue-d:var(--lilac-d)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;word-break:keep-all;background:var(--paper);color:var(--ink);font-family:var(--ui);font-weight:400;line-height:1.5}
h1,h2,h3,p{margin:0;font-weight:400}
strong,b{font-weight:400}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,box-shadow .12s ease,background-color .2s,border-color .2s}
button:focus-visible{outline:3px solid #7FA6C9;outline-offset:3px}
button:disabled{cursor:default}
.drawn-art{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* 틀 */
.app{max-width:1080px;margin:auto;padding:20px 28px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--play);font-size:23px;border-radius:999px;padding:2px 10px 2px 2px}
.brand-icon{width:48px;height:48px;border-radius:50%;background:var(--butter);overflow:hidden;flex-shrink:0}
.brand-icon .drawn-art{width:44px;height:44px;margin:5px auto 0}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:14px}

/* 버튼 두 종류 */
.soft-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:10px 20px;border-radius:999px;background:#fff;border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:17px;white-space:nowrap}
.soft-btn svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.soft-btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
#sound[aria-pressed=false]{background:#F3EEE7;color:var(--muted)}
.primary{display:inline-flex;align-items:center;justify-content:center;min-height:60px;padding:14px 36px;border-radius:999px;background:var(--sage-deep);color:#fff;font-family:var(--play);font-size:23px;box-shadow:0 4px 0 var(--sage-deeper)}
.primary:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 var(--sage-deeper)}
.primary:disabled{opacity:.45}

/* 홈 */
.hero{position:relative;display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;background:var(--sage);border-radius:36px;padding:48px 52px 0;overflow:hidden;isolation:isolate}
.hero:before{content:'';position:absolute;right:13%;top:34px;width:74px;height:74px;border-radius:50%;background:#FBEBBB;z-index:-1}
.hero-text{padding-bottom:52px}
.hero h1{font-family:var(--play);font-size:clamp(36px,5vw,56px);line-height:1.18}
.hero p{margin-top:14px;font-size:18px;color:#5A6A5A}
.hero-art{position:relative;width:380px;height:220px}
.hero-art:before{content:'';position:absolute;left:-40px;right:-70px;bottom:-60px;height:140px;border-radius:50% 50% 0 0;background:#BFDAB6}
.hero-pet{position:absolute;bottom:18px}
.hero-pet.p1{left:8px;width:118px;height:118px;transform:rotate(-6deg)}
.hero-pet.p2{left:118px;width:150px;height:170px;bottom:26px}
.hero-pet.p3{left:252px;width:118px;height:118px;transform:rotate(6deg)}
.section-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 4px 16px}
.section-top h2{font-family:var(--play);font-size:26px}
.section-top span{font-size:15px;color:var(--muted)}
.games{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.game-card{grid-column:span 2;display:flex;flex-direction:column;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:28px;padding:12px 12px 22px;box-shadow:0 4px 0 var(--line)}
.game-card:nth-child(n+4){grid-column:span 3}
.game-card:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.card-art{position:relative;isolation:isolate;height:150px;border-radius:20px;background:var(--hue);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;overflow:hidden}
.game-card h3{font-family:var(--play);font-size:24px;padding:0 8px}
.game-card p{color:var(--muted);font-size:15px;margin-top:3px;padding:0 8px}
.mini-card{width:84px;height:100px;background:#fff;border-radius:14px;box-shadow:0 3px 0 var(--hue-d);padding:12px 8px;transform:rotate(-8deg)}
.mini-card+.mini-card{transform:rotate(8deg)}
.card-mole{width:130px;height:130px;margin-bottom:-40px;position:relative}
.card-mole:after{content:'';position:absolute;left:-14px;right:-14px;bottom:28px;height:30px;border-radius:50%;background:#B8977C;border:5px solid #E8D6C0;z-index:-1}
.card-balloon{position:relative;display:grid;place-items:center;width:70px;height:86px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;font-family:var(--play);font-size:32px;margin-top:-18px}
.card-balloon:after{content:'';position:absolute;top:100%;left:50%;width:1.5px;height:34px;background:#9DB2BB}
.card-balloon.b1{background:#F6C9C9;transform:rotate(-8deg)}
.card-balloon.b2{background:#FBEBBB;transform:rotate(7deg) translateY(10px)}
.card-pic{width:96px;height:96px}
.card-pic.small{width:62px;height:62px}
.card-stones{display:flex;gap:8px}
.card-stones i{display:grid;place-items:center;width:46px;height:38px;border-radius:46%;background:#fff;box-shadow:0 3px 0 var(--hue-d);font-style:normal;font-family:var(--play);font-size:21px}
.home-foot{text-align:center;color:var(--muted);font-size:15px;margin-top:32px}

/* 놀이 화면 공통 */
.game-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.game-head h2{font-family:var(--play);font-size:34px;line-height:1.25}
.game-head p{color:var(--muted);margin-top:4px;font-size:16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.controls .control-group,.controls [data-level],#change-mode{display:none}
.stage{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:32px;padding:26px;min-height:420px;overflow:hidden}
.status{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.stat{background:var(--hue);border-radius:999px;padding:9px 20px;font-size:18px}
.hint{text-align:center;min-height:30px;font-size:19px;margin-top:18px;color:#6B5E55}
.start-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:380px;text-align:center}
.start-panel h2{font-family:var(--play);font-size:30px}
.start-panel p{color:var(--muted);font-size:18px;line-height:1.7;margin-bottom:8px}
.start-pic{width:150px;height:150px}

/* 고르기 화면 */
.setup-screen{max-width:820px;margin:auto;text-align:center;padding:6px 0 4px}
.setup-screen h2{font-family:var(--play);font-size:30px}
.setup-subtitle{color:var(--muted);margin:6px 0 4px;font-size:17px}
.setup-screen h3{text-align:left;font-size:19px;margin:28px 4px 12px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.choice-grid.levels{grid-template-columns:repeat(3,1fr)}
.choice-block{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;padding:16px 10px;background:#fff;border:2px solid var(--line);border-radius:24px;box-shadow:0 4px 0 var(--line)}
.choice-block[aria-pressed=true]{background:var(--hue);border-color:var(--hue-d);box-shadow:0 4px 0 var(--hue-d)}
.choice-block:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.choice-picture{height:76px;display:flex;align-items:center;justify-content:center;font-family:var(--play);font-size:30px;word-spacing:6px;white-space:nowrap}
.choice-picture .drawn-art{width:74px;height:74px}
.choice-block strong{font-size:20px}
.choice-block small{font-size:14px;color:var(--muted)}
.choice-check{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--sage-deep);color:#fff;font-size:14px;line-height:26px;display:none}
.choice-block[aria-pressed=true] .choice-check{display:block}
.level-dots{height:36px;display:flex;align-items:center;font-size:24px;letter-spacing:3px;color:#E5BE5C}
.setup-start{margin-top:32px;min-width:220px}

/* 같은 그림 찾기 */
.memory-grid{display:grid;gap:12px;max-width:720px;margin:auto;grid-template-columns:repeat(var(--cols,2),1fr)}
.memory-card{aspect-ratio:1;max-height:170px;border-radius:20px;background:var(--butter) radial-gradient(#ffffff99 2px,transparent 2.6px) 0 0/18px 18px;border:2px solid var(--butter-d);box-shadow:0 4px 0 var(--butter-d);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.memory-card .back{display:grid;place-items:center;width:52%;aspect-ratio:1;border-radius:50%;background:#fff;font-family:var(--play);font-size:clamp(24px,4vw,38px);color:#C9A14D}
.memory-card.flipped{background:#fff;border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.memory-card.matched{background:var(--sage);border-color:var(--sage-d);box-shadow:0 4px 0 var(--sage-d);animation:pop .3s}
.memory-card .face{display:block;width:70%;flex:1;min-height:0}
.memory-card small{font-size:15px}

/* 두더지 잡기 */
.mole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:600px;margin:auto}
.hole{position:relative;aspect-ratio:1.25;overflow:hidden;isolation:isolate}
.hole:before{content:'';position:absolute;left:5%;right:5%;bottom:5%;height:34%;background:#B8977C;border:6px solid #E8D6C0;border-radius:50%;z-index:-1}
.mole{position:absolute;left:17%;width:66%;height:84%;bottom:13%;transform:translateY(115%);transition:transform .16s ease-out;pointer-events:none}
.hole.up .mole{transform:translateY(0)}
.hole.hit:after{content:'+5';position:absolute;top:14%;left:0;right:0;text-align:center;font-family:var(--play);font-size:30px;color:var(--sage-deep);animation:pop .3s}

/* 풍선 터뜨리기 */
.target-prompt{display:flex;align-items:center;gap:12px;font-size:20px}
.target-block{display:grid;place-items:center;width:68px;height:68px;border-radius:20px;background:var(--butter);border:2px solid var(--butter-d);font-family:var(--play);font-size:38px}
.balloon-stage{position:relative;height:min(58vh,500px);min-height:340px;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse 54px 18px at 20% 14%,#ffffffcc 95%,transparent),radial-gradient(ellipse 70px 20px at 76% 24%,#ffffffb3 95%,transparent),linear-gradient(#D7E9F3,#F3F8FA)}
.balloon{position:absolute;bottom:-150px;left:var(--x);width:86px;height:106px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:var(--balloon);font-family:var(--play);font-size:36px;color:var(--ink);box-shadow:inset -8px -10px 0 #0000000c;animation:floatUp var(--duration) linear forwards;z-index:1}
.balloon:before{content:'';position:absolute;top:15px;left:16px;width:12px;height:22px;border-radius:50%;background:#ffffff8c;transform:rotate(22deg)}
.balloon:after{content:'';position:absolute;top:104px;left:50%;width:1.5px;height:46px;background:#9DB2BB}
.balloon.wrong{animation-play-state:paused;opacity:.45}

/* 동물들의 주문 받기 */
.order-scene{display:flex;justify-content:center;align-items:center;gap:22px;margin:4px 0 24px}
.animal{width:140px;height:140px;flex-shrink:0}
.speech{position:relative;background:var(--blush);border-radius:26px;padding:20px 28px;font-size:23px;line-height:1.5}
.speech:before{content:'';position:absolute;left:-14px;top:42px;border-right:16px solid var(--blush);border-top:11px solid transparent;border-bottom:11px solid transparent}
.speech strong{font-family:var(--play);font-size:30px}
.food-preview{display:inline-block;width:46px;height:46px;vertical-align:middle;margin-right:4px}
.food-shelf{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.food{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:104px;padding:12px 10px 10px;background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--line)}
.food:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.food span{width:64px;height:64px}
.food small{font-size:16px}
.basket{margin:24px auto 18px;max-width:600px;min-height:100px;background:#FBF1DE;border:2px dashed #E0C79C;border-radius:22px 22px 44px 44px;padding:16px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.basket span:not(.basket-empty){width:52px;height:52px;animation:pop .25s}
.basket .basket-empty{font-size:17px;color:#A68D69}
.order-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

/* 징검다리 건너기 */
.bridge-target{font-size:18px}
.bridge-target strong{display:inline-grid;place-items:center;min-width:48px;height:48px;padding:0 8px;margin-left:8px;border-radius:14px;background:var(--butter);font-family:var(--play);font-size:26px;vertical-align:middle}
.progress{height:8px;border-radius:8px;background:#EFE8DE;overflow:hidden;max-width:420px;margin:0 auto 20px}
.progress div{height:100%;background:var(--sage-d);transition:width .3s}
.journey{position:relative;height:480px;overflow:hidden;border-radius:26px;background:repeating-linear-gradient(176deg,#D3EAF2 0 44px,#DEF0F6 44px 50px);isolation:isolate}
.journey:before,.journey:after{content:'';position:absolute;top:0;bottom:0;width:9%;background:#CFE3C6;z-index:3;pointer-events:none}
.journey:before{left:0;border-radius:0 40% 40% 0}
.journey:after{right:0;border-radius:40% 0 0 40%}
.river-world{position:absolute;left:0;right:0;bottom:0;transition:transform .65s ease-in-out}
.journey-row{position:absolute;left:9%;width:82%;height:80px;display:flex;justify-content:space-evenly;align-items:center;gap:12px}
.journey-row .stone{position:relative;flex:0 1 120px;min-height:74px;border-radius:46% 50% 42% 48%/50% 46% 52% 44%;background:#fff;border:2px solid #CFC6BA;box-shadow:0 5px 0 #A9BDB8;font-family:var(--play);font-size:32px;z-index:2}
.journey-row .stone:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 #A9BDB8}
.journey-row .stone:disabled{opacity:.35}
.journey-row .stone.done{opacity:1;background:var(--sage);border-color:var(--sage-d);box-shadow:0 5px 0 var(--sage-d)}
.ghost-stone{width:24%;max-width:100px;height:52px;border-radius:46%;background:#ffffff66;border:2px dashed #A9CBD8;color:transparent}
.journey-row.active-row:before{content:'다음 돌을 골라요';position:absolute;top:-30px;left:0;right:0;text-align:center;font-size:15px;color:#4F7280}
.river-dock{position:absolute;left:22%;width:56%;height:84px;border-radius:18px;background:repeating-linear-gradient(90deg,#EFD9B9 0 30px,#E3C9A3 30px 32px);border:2px solid #D9BE95;text-align:center;padding-top:10px;font-size:19px;color:#6B5340}
.river-dock.start{bottom:0}
.journey-rabbit{position:absolute;width:64px;height:76px;left:50%;bottom:30px;transform:translateX(-50%);transition:left .5s ease,bottom .5s ease;z-index:5;pointer-events:none}
.journey-rabbit.hopping .drawn-art{animation:rabbit-hop .5s ease-in-out}
.journey-note{text-align:center;color:var(--muted);font-size:14px;margin-top:12px}

/* 쉬기 · 알림 · 결과 */
.paused-banner{position:absolute;inset:0;z-index:10;background:#FBF7F1F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.paused-banner h2{font-family:var(--play);font-size:30px}
.paused-pic{width:110px;height:110px}
.feedback-popup{position:fixed;inset:0;z-index:18;display:grid;place-items:center;padding:24px;pointer-events:none}
.feedback-card{max-width:400px;background:#fff;border-radius:28px;box-shadow:0 18px 50px #4B3F3A2b;padding:22px 30px 26px;text-align:center;font-size:22px;line-height:1.5;animation:pop .2s}
.feedback-icon{display:block;width:84px;height:84px;margin:0 auto 6px}
.feedback-popup.leaving{opacity:0;transition:opacity .15s}
.modal-backdrop{position:fixed;inset:0;z-index:20;background:#4B3F3A59;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:32px;box-shadow:0 24px 70px #4B3F3A40;padding:26px 30px 30px;text-align:center;width:100%;max-width:460px;max-height:94dvh;overflow:auto;animation:pop .3s}
.reward-stars{display:flex;gap:8px;justify-content:center;align-items:center;height:76px}
.reward-star{width:60px;height:60px;overflow:visible}
.reward-star:nth-child(2){width:72px;height:72px}
.reward-star path{stroke-width:4;stroke-linejoin:round}
.reward-star.earned{animation:twinkle 1.6s ease-in-out var(--delay) 2}
.reward-star.earned path{fill:#F6D77E;stroke:#E2B955}
.reward-star.empty path{fill:none;stroke:#E6DDD2}
.reward-modal h2{font-family:var(--play);font-size:34px;margin:10px 0 0}
.reward-mascot{width:118px;height:118px;margin:6px auto}
.reward-achievement{font-size:21px}
.reward-modal p{font-size:16px;color:var(--muted);margin:6px 0 14px;line-height:1.6}
.reward-sticker{display:inline-block;background:var(--butter);border-radius:999px;padding:8px 22px;font-size:18px}
.reward-rule{display:block;color:var(--muted);font-size:13px;margin:10px 0 22px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions button{min-height:58px;font-size:20px;padding:10px}
.confetti{position:fixed;top:-20px;z-index:30;width:12px;height:12px;border-radius:50%;pointer-events:none;animation:fall 2s ease-in forwards}

@keyframes floatUp{from{transform:translateY(0)}to{transform:translateY(calc(-1 * var(--travel)))}}
@keyframes pop{0%{transform:scale(.85)}65%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(105vh);opacity:0}}
@keyframes rabbit-hop{50%{transform:translateY(-36px)}}
@keyframes twinkle{50%{transform:scale(1.08)}}

@media(max-width:760px){
 .app{padding:16px 16px 32px}
 .hero{grid-template-columns:1fr;padding:34px 30px 0;border-radius:30px}
 .hero:before{top:22px;right:24px;width:54px;height:54px}
 .hero-text{padding-bottom:0}
 .hero-art{width:380px;height:200px;margin:-10px auto 0;transform:scale(.8);transform-origin:bottom center}
 .games{gap:14px}
 .game-card,.game-card:nth-child(n+4){grid-column:span 3}
 .game-card:last-child{grid-column:span 6}
 .card-art{height:126px}
 .game-head h2{font-size:28px}
 .stage{padding:18px;border-radius:26px}
}
@media(max-width:480px){
 .brand{font-size:20px}.brand-icon{width:42px;height:42px}.brand-icon .drawn-art{width:38px;height:38px}
 .soft-btn{font-size:15px;padding:8px 14px;min-height:44px}
 .hero{padding:28px 22px 0}.hero h1{font-size:34px}.hero p{font-size:15px}
 .hero-art{transform:scale(.7);margin-top:-50px}
 .section-top{flex-direction:column;gap:2px}
 .game-card{padding:9px 9px 16px;border-radius:22px}
 .card-art{height:100px;gap:6px}
 .game-card h3{font-size:19px;padding:0 4px}.game-card p{font-size:13px;padding:0 4px}
 .mini-card{width:56px;height:68px;padding:7px 5px}
 .card-mole{width:96px;height:96px;margin-bottom:-30px}
 .card-balloon{width:52px;height:64px;font-size:24px}
 .card-pic{width:70px;height:70px}.card-pic.small{width:44px;height:44px}
 .card-stones i{width:36px;height:30px;font-size:17px}
 .game-head h2{font-size:26px}.game-head p{font-size:14px}
 .stage{padding:12px}
 .choice-grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .choice-grid.levels{gap:8px}
 .choice-block{min-height:126px;padding:12px 6px}
 .choice-block strong{font-size:17px}.choice-block small{font-size:12px}
 .choice-picture{height:62px;font-size:24px}.choice-picture .drawn-art{width:60px;height:60px}
 .level-dots{font-size:17px;letter-spacing:1px}
 .memory-grid{gap:8px}.memory-card{border-radius:14px;padding:5px}.memory-card small{font-size:12px}
 .mole-grid{gap:6px}
 .stat{padding:7px 14px;font-size:16px}
 .animal{width:96px;height:96px}
 .order-scene{gap:16px}
 .speech{padding:14px 18px;font-size:19px}.speech strong{font-size:24px}
 .food-shelf{gap:8px}.food{min-width:70px;padding:8px 4px}.food span{width:48px;height:48px}.food small{font-size:14px}
 .basket span:not(.basket-empty){width:40px;height:40px}
 .balloon{width:70px;height:88px;font-size:30px}.balloon:after{top:86px}
 .journey{height:430px}
 .journey-row{left:9%;width:82%;gap:8px}
 .journey-row .stone{font-size:27px;min-height:66px}
 .journey-rabbit{width:54px;height:66px}
 .river-dock{font-size:17px}
 .feedback-card{font-size:20px;padding:20px}
 .reward-modal{padding:20px 18px 24px}.reward-modal h2{font-size:30px}.modal-actions button{font-size:18px}
 .hint{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{transition-duration:0s!important}
 .confetti{display:none}
 .modal,.feedback-card,.basket span,.memory-card.matched,.reward-star.earned,.journey-rabbit.hopping .drawn-art,.hole.hit:after{animation:none}
}

/* 아이가 직접 누르는 버튼은 주아체 */
.choice-block strong,.food small,.memory-card small,.stage .soft-btn,.modal-actions button{font-family:var(--play)}

/* 새로 생긴 놀이 */
.paint-palette,.studio-tools,.phone-friends{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.swatch{width:52px;height:52px;border-radius:50%;background:var(--paint);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line),0 3px 0 var(--line);color:#fff;font-size:22px;text-shadow:0 1px 2px #0006}
.swatch[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.08)}
.studio-tools .soft-btn[aria-pressed=true],.phone-friends .soft-btn[aria-pressed=true]{background:var(--hue);border-color:var(--hue-d);box-shadow:0 3px 0 var(--hue-d)}
#art-canvas{display:block;width:100%;max-width:800px;height:auto;aspect-ratio:4/3;margin:auto;background:#fff;border-radius:22px;border:2px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.reward-modal>.soft-btn{margin-top:12px}
.puzzle-layout{display:grid;grid-template-columns:minmax(0,440px) 140px;justify-content:center;gap:22px;align-items:center}
.puzzle-board{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);aspect-ratio:1;background:#fff;border:3px solid var(--hue-d);border-radius:18px;overflow:hidden}
.puzzle-slot{min-width:0;min-height:0;border-radius:0;background-color:#FBF7F1;background-repeat:no-repeat;outline:1.5px dashed var(--line);outline-offset:-1px;font-family:var(--play);font-size:24px;color:#CDBFB0}
.puzzle-slot:disabled{outline:0;background-color:#fff}
.puzzle-layout .center{text-align:center;color:var(--muted);font-size:15px;margin-bottom:6px}
.puzzle-reference{background:var(--hue);border-radius:18px;padding:10px}
.puzzle-reference .drawn-art{height:auto}
.puzzle-tray{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:12px;max-width:440px;margin:18px auto 0}
.puzzle-piece{aspect-ratio:var(--rows)/var(--cols);background-color:#fff;background-repeat:no-repeat;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.puzzle-piece[aria-pressed=true]{border-color:var(--hue-d);box-shadow:0 0 0 3px var(--hue-d)}
.phone-friends .soft-btn{min-height:64px;padding:6px 20px 6px 8px;font-family:var(--play);font-size:19px}
.phone-friends .drawn-art{width:50px;height:50px}
.toy-phone{max-width:340px;margin:auto;background:var(--lilac);border-radius:40px;padding:24px;box-shadow:0 5px 0 var(--lilac-d);text-align:center}
.toy-phone p{font-size:20px}
.phone-display{background:#fff;border-radius:20px;min-height:66px;padding:14px 8px;margin:14px 0;font-family:var(--play);font-size:26px}
.phone-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.phone-keys button{min-height:62px;border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--lilac-d);font-family:var(--play);font-size:28px}
.phone-keys button:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.phone-keys [data-digit="지우기"]{font-size:18px}
.phone-keys [data-digit="전화"]{background:var(--sage-deep);color:#fff;font-size:22px;box-shadow:0 4px 0 var(--sage-deeper)}
.toy-phone .soft-btn{font-family:var(--play)}
.dress-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.dress-scene{background:var(--hue);border-radius:28px;text-align:center;padding:16px}
.dress-bear{position:relative;width:300px;height:340px;max-width:100%;margin:auto}
.dress-shirt{position:absolute;left:23%;top:52%;width:54%;height:30%;background:#7CC79A;clip-path:polygon(20% 0,35% 0,40% 10%,60% 10%,65% 0,80% 0,100% 27%,82% 46%,75% 30%,75% 100%,25% 100%,25% 30%,18% 46%,0 27%);display:grid;place-items:center}
.dress-shirt span{color:#fff;font-size:30px}
.dress-hat{position:absolute;left:20%;top:0;width:60%;height:35%;transform:rotate(-8deg)}
.dress-shoes{position:absolute;left:10%;bottom:2%;width:80%;height:23%;display:flex}
.dress-shoes .drawn-art{width:50%}
.dress-shoes[hidden],.dress-hat[hidden]{display:none}
.wardrobe h3,.dress-scene p{font-family:var(--play);font-size:22px;text-align:center}
.wardrobe h3{margin:10px 0 4px}
.dress-options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.wardrobe>p{text-align:center;color:var(--muted);font-size:15px}
@media(max-width:760px){.dress-layout{grid-template-columns:1fr}.dress-bear{width:250px;height:280px}.puzzle-layout{grid-template-columns:minmax(0,1fr) 96px;gap:12px}}
@media(max-width:480px){.puzzle-layout{grid-template-columns:1fr}.puzzle-layout>div:last-child{display:flex;align-items:center;justify-content:center;gap:12px}.puzzle-reference{width:90px}.swatch{width:42px;height:42px;font-size:18px}.paint-palette{gap:9px}.studio-tools{gap:8px}.phone-friends .soft-btn{font-size:16px;padding:4px 12px 4px 6px}.phone-friends .drawn-art{width:38px;height:38px}}
</style>
</head>

function artStudio(mode='drawing',template='flower'){
 shell(mode);currentRestart=()=>artStudio(mode,template);state={color:paintColors[0][0],width:14,eraser:false,strokes:[],fills:{},history:[]};
 $('#stage').innerHTML=`${mode==='coloring'?`<div class="studio-tools">${[['flower','꽃'],['house','집'],['balloons','풍선']].map(([v,n])=>`<button class="soft-btn" data-template="${v}" aria-pressed="${template===v}">${n}</button>`).join('')}</div>`:''}${palette()}<div class="studio-tools">${mode==='drawing'?'<button class="soft-btn" id="brush-size">붓 크기: 보통</button><button class="soft-btn" id="eraser" aria-pressed="false">지우개</button>':''}<button class="soft-btn" id="art-undo">되돌리기</button><button class="soft-btn" id="art-clear">모두 지우기</button><button class="soft-btn" id="art-save">그림 저장</button><button class="primary" id="art-done">다 그렸어요</button></div><canvas id="art-canvas" width="800" height="600" aria-label="${mode==='drawing'?'손가락으로 그리는 도화지':'색칠할 그림'}"></canvas><p class="hint" id="hint">${mode==='drawing'?'손가락이나 마우스로 쓱쓱 그려요':'색을 고르고 하얀 영역을 톡 눌러요'}</p>`;
 const canvas=$('#art-canvas'),ctx=canvas.getContext('2d'),regions=[];let active=null;
 const shape=(id,path)=>regions.push({id,path});
 const ellipse=(id,x,y,rx,ry)=>{const p=new Path2D();p.ellipse(x,y,rx,ry,0,0,Math.PI*2);shape(id,p)};
 const polygon=(id,pts)=>{const p=new Path2D();p.moveTo(...pts[0]);pts.slice(1).forEach(q=>p.lineTo(...q));p.closePath();shape(id,p)};
 if(mode==='coloring'){
  if(template==='flower'){polygon('stem',[[386,300],[414,300],[414,540],[386,540]]);ellipse('leaf1',340,450,60,28);ellipse('leaf2',460,490,60,28);for(let i=0;i<6;i++){const a=i*Math.PI/3;ellipse('petal'+i,400+Math.cos(a)*105,240+Math.sin(a)*105,64,64)}ellipse('center',400,240,68,68)}
  if(template==='house'){polygon('house',[[220,270],[580,270],[580,530],[220,530]]);polygon('roof',[[180,270],[400,85],[620,270]]);polygon('door',[[355,360],[445,360],[445,530],[355,530]]);polygon('window1',[[255,320],[325,320],[325,390],[255,390]]);polygon('window2',[[475,320],[545,320],[545,390],[475,390]]);ellipse('sun',660,100,48,48)}
  if(template==='balloons'){ellipse('left',230,260,100,135);ellipse('right',570,260,100,135);ellipse('middle',400,190,105,140)}
 }
 function render(){ctx.fillStyle='#fff';ctx.fillRect(0,0,800,600);ctx.lineCap='round';ctx.lineJoin='round';if(mode==='coloring'){if(template==='balloons'){ctx.strokeStyle='#936446';ctx.lineWidth=5;[[230,395],[400,330],[570,395]].forEach(([x,y])=>{ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x-35,500,400,565);ctx.stroke()})}regions.forEach(r=>{ctx.fillStyle=state.fills[r.id]||'#fff';ctx.fill(r.path);ctx.strokeStyle='#78563F';ctx.lineWidth=5;ctx.stroke(r.path)})}else state.strokes.forEach(s=>{ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.width;ctx.beginPath();ctx.arc(s.points[0][0],s.points[0][1],s.width/2,0,Math.PI*2);ctx.fill();ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()})}
 wirePalette(c=>{state.color=c;state.eraser=false;if($('#eraser'))$('#eraser').setAttribute('aria-pressed','false')});
 $$('[data-template]').forEach(b=>b.onclick=()=>artStudio(mode,b.dataset.template));
 function snapshot(){state.history.push(JSON.stringify({fills:state.fills,strokes:state.strokes}));if(state.history.length>30)state.history.shift()}
 const point=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*600/r.height]};
 canvas.onpointerdown=e=>{if(active!==null)return;e.preventDefault();const p=point(e);if(mode==='coloring'){const r=[...regions].reverse().find(r=>ctx.isPointInPath(r.path,...p));if(r){snapshot();state.fills[r.id]=state.color;tone();render()}return}snapshot();active=e.pointerId;canvas.setPointerCapture(active);state.strokes.push({color:state.eraser?'#fff':state.color,width:state.eraser?42:state.width,points:[p]});render()};
 canvas.onpointermove=e=>{if(active!==e.pointerId)return;e.preventDefault();state.strokes.at(-1).points.push(point(e));render()};
 canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=()=>{active=null};
 $('#art-undo').onclick=()=>{active=null;if(state.history.length){Object.assign(state,JSON.parse(state.history.pop()));render();tone()}};
 $('#art-clear').onclick=()=>{active=null;snapshot();state.strokes=[];state.fills={};render();tone()};
 if(mode==='drawing'){$('#eraser').onclick=()=>{state.eraser=!state.eraser;$('#eraser').setAttribute('aria-pressed',String(state.eraser));tone()};$('#brush-size').onclick=()=>{state.width=state.width===14?28:state.width===28?6:14;$('#brush-size').textContent='붓 크기: '+({6:'가늘게',14:'보통',28:'굵게'}[state.width]);tone()}}
 $('#art-save').onclick=()=>saveCanvas(canvas,'몽글몽글-'+titles[mode][0]);$('#art-done').onclick=()=>{if(!state.strokes.length&&!Object.keys(state.fills).length){popup('먼저 그림에 색을 더해 볼까요?');return}result('멋진 작품이 완성됐어요!','내가 고른 색으로 세상을 꾸몄어요.');const save=document.createElement('button');save.className='soft-btn';save.textContent='그림 저장';save.onclick=()=>saveCanvas(canvas,'몽글몽글-'+titles[mode][0]);$('.reward-modal').append(save)};render();
}
function puzzleSetup(){shell('puzzle');let picture='cat',level=0;$('#stage').innerHTML=`<div class="setup-screen"><h2>어떻게 놀아 볼까요?</h2><p class="setup-subtitle">마음에 드는 네모를 톡 눌러요!</p><h3>1. 그림을 골라요</h3><div class="choice-grid">${[['cat','고양이'],['dog','강아지'],['car','자동차']].map(([v,n],i)=>`<button class="choice-block" data-picture="${v}" aria-pressed="${i===0}"><span class="choice-picture">${rasterArt(v)}</span><strong>${n}</strong><span class="choice-check">✓</span></button>`).join('')}</div><h3>2. 난이도를 골라요</h3><div class="choice-grid levels">${['쉬움','보통','어려움'].map((v,i)=>`<button class="choice-block" data-puzzle-level="${i}" aria-pressed="${i===0}"><span class="level-dots">${'★'.repeat(i+1)}</span><strong>${v}</strong><small>${[4,6,9][i]}조각</small><span class="choice-check">✓</span></button>`).join('')}</div><button class="primary setup-start" id="puzzle-start">놀이 시작</button></div>`;const bind=(sel,fn)=>$$(sel).forEach(b=>b.onclick=()=>{fn(b);tone();$$(sel).forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});bind('[data-picture]',b=>picture=b.dataset.picture);bind('[data-puzzle-level]',b=>level=+b.dataset.puzzleLevel);$('#puzzle-start').onclick=()=>puzzle(picture,level)}
function puzzle(picture='cat',level=0){shell('puzzle');currentRestart=()=>puzzle(picture,level);const cols=level===0?2:3,rows=level===2?3:2,n=cols*rows;state={selected:null,placed:[],picture,level};$('#stage').innerHTML=`<div class="status"><span class="stat" id="puzzle-count">0 / ${n}조각</span><button class="soft-btn" id="puzzle-change">다른 퍼즐</button></div><div class="puzzle-layout"><div class="puzzle-board" style="--cols:${cols};--rows:${rows}">${Array.from({length:n},(_,i)=>`<button class="puzzle-slot" data-slot="${i}" aria-label="${Math.floor(i/cols)+1}줄 ${i%cols+1}칸">${i+1}</button>`).join('')}</div><div><p class="center">이 그림을 만들어요</p><div class="puzzle-reference">${rasterArt(picture)}</div></div></div><p class="hint" id="hint">아래 조각을 고르고 빈칸을 눌러요</p><div class="puzzle-tray" style="--cols:${cols};--rows:${rows}">${shuffle(Array.from({length:n},(_,i)=>i)).map(i=>`<button class="puzzle-piece" data-piece="${i}" aria-label="그림 조각 ${i+1}" aria-pressed="false"></button>`).join('')}</div>`;
 const decorate=(b,i)=>{b.style.backgroundImage=`url("${rasterIcons[picture]}")`;b.style.backgroundSize=`${cols*100}% ${rows*100}%`;b.style.backgroundPosition=`${i%cols/(cols-1)*100}% ${Math.floor(i/cols)/(rows-1)*100}%`};
 $$('[data-piece]').forEach(b=>{decorate(b,+b.dataset.piece);b.onclick=()=>{state.selected=+b.dataset.piece;tone();$$('[data-piece]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));hint('조각이 들어갈 빈칸을 눌러요')}});
 $$('[data-slot]').forEach(b=>b.onclick=()=>{if(b.disabled)return;if(state.selected===null){popup('아래에서 조각을 먼저 골라요');return}const i=+b.dataset.slot;if(i!==state.selected){tone('soft');popup('그림을 보고 다른 칸에 놓아 볼까요?');return}decorate(b,i);b.textContent='';b.disabled=true;const piece=$$('[data-piece]').find(x=>+x.dataset.piece===i);piece.disabled=true;piece.style.visibility='hidden';state.placed.push(i);state.selected=null;$('#puzzle-count').textContent=`${state.placed.length} / ${n}조각`;tone('good');if(state.placed.length===n)later(()=>result('퍼즐을 완성했어요!',`${n}개의 조각이 멋진 그림이 됐어요.`),500)});$('#puzzle-change').onclick=puzzleSetup;
}
function phone(){shell('phone');currentRestart=phone;state={digits:'',friend:0,calling:false};const friends=[['dog','강아지','123','안녕! 나는 강아지야. 만나서 반가워!'],['cat','고양이','456','야옹! 나는 고양이야. 오늘도 같이 놀자!'],['rabbit','토끼','789','안녕! 나는 토끼야. 폴짝폴짝 뛰어 볼까?']];
 $('#stage').innerHTML=`<div class="phone-friends">${friends.map(([v,n],i)=>`<button class="soft-btn" data-friend="${i}" aria-pressed="${i===0}">${pet(v)}${n}</button>`).join('')}</div><div class="toy-phone"><p id="phone-target"></p><div class="phone-display" id="phone-display" role="status">번호를 눌러요</div><div class="phone-keys">${['1','2','3','4','5','6','7','8','9','지우기','0','전화'].map(v=>`<button data-digit="${v}" aria-label="${v}">${v}</button>`).join('')}</div><button class="soft-btn" id="phone-end">통화 끝내기</button></div><p class="hint" id="hint">동물 친구에게 거는 장난감 전화예요</p>`;
 const target=()=>{$('#phone-target').textContent=friends[state.friend][1]+' 번호: '+friends[state.friend][2].split('').join(' ');$('#phone-display').textContent='번호를 눌러요'};target();
 $$('[data-friend]').forEach(b=>b.onclick=()=>{if(state.calling){popup('통화를 끝내고 다른 친구를 골라요');return}state.friend=+b.dataset.friend;state.digits='';$$('[data-friend]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));target();tone()});
 $$('[data-digit]').forEach(b=>b.onclick=()=>{if(state.calling)return;const v=b.dataset.digit;if(v==='전화'){if(state.digits!==friends[state.friend][2]){popup('친구의 번호를 다시 보고 눌러요');tone('soft');return}state.calling=true;tone('win');$('#phone-display').textContent=friends[state.friend][1]+'와 통화 중';hint(friends[state.friend][3]);speak(friends[state.friend][3]);return}if(v==='지우기')state.digits=state.digits.slice(0,-1);else{if(state.digits.length>=3){popup('세 자리 번호예요. 전화 버튼을 눌러요');return}state.digits+=v;tone();speak(v)}$('#phone-display').textContent=state.digits.split('').join(' ')||'번호를 눌러요'});
 $('#phone-end').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();state.calling=false;state.digits='';target();tone();hint('다른 친구에게도 전화해 볼까요?')};
}
function dress(){shell('dress');currentRestart=dress;state={outfit:'#7CC79A',hat:false,shoes:false,changed:false};$('#stage').innerHTML=`<div class="dress-layout"><div class="dress-scene"><div class="dress-bear">${pet('bear')}<div class="dress-shirt" id="dress-shirt"><span>★</span></div><div class="dress-hat" id="dress-hat" hidden>${objectArt('hat')}</div><div class="dress-shoes" id="dress-shoes" hidden>${objectArt('shoe')}${objectArt('shoe')}</div></div><p>오늘의 멋쟁이 곰</p></div><div class="wardrobe"><h3>옷 색을 골라요</h3>${palette()}<h3>소품도 골라요</h3><div class="dress-options"><button class="choice-block" id="wear-hat" aria-pressed="false"><span class="choice-picture">${objectArt('hat')}</span><strong>모자</strong></button><button class="choice-block" id="wear-shoes" aria-pressed="false"><span class="choice-picture">${objectArt('shoe')}</span><strong>신발</strong></button></div><p>한 번 더 누르면 벗어요.</p><div class="studio-tools"><button class="soft-btn" id="dress-reset">처음으로</button><button class="primary" id="dress-done">다 입었어요</button></div></div></div>`;$$('[data-color]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.color===state.outfit));b.textContent=b.dataset.color===state.outfit?'✓':''});wirePalette(c=>{state.outfit=c;state.changed=true;$('#dress-shirt').style.background=c});for(const part of ['hat','shoes'])$('#wear-'+part).onclick=()=>{state[part]=!state[part];state.changed=true;$('#dress-'+part).hidden=!state[part];$('#wear-'+part).setAttribute('aria-pressed',String(state[part]));tone()};$('#dress-reset').onclick=dress;$('#dress-done').onclick=()=>{if(!state.changed){popup('좋아하는 옷이나 소품을 골라요');return}result('곰 친구가 멋쟁이가 됐어요!','내가 고른 색과 소품으로 꾸몄어요.','🐻')};}

$('#brand').onclick=home;$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').setAttribute('aria-pressed',String(soundOn));soundLabel();if(soundOn)tone();else if('speechSynthesis'in window)speechSynthesis.cancel()};document.addEventListener('pointerdown',audioReady,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.running&&!paused&&$('#pause'))$('#pause').click()});function soundLabel(){$('#sound').innerHTML=soundOn?ui.on+'소리 켜짐':ui.off+'소리 꺼짐'}soundLabel();$('#brand-icon').innerHTML=pet('rabbit');home();
</script></body></html>
